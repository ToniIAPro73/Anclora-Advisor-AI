name: CI

on:
  pull_request:
    branches: [development, staging, production, main]
  push:
    branches: [development, staging, production, main]

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e-ui:
    name: E2E UI Tests
    runs-on: ubuntu-latest
    needs: gate
    outputs:
      enabled: ${{ steps.preflight.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preflight secrets
        id: preflight
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY DATABASE_URL; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::warning::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: ${{ steps.preflight.outputs.enabled == 'true' }}
        run: npm ci

      - name: Install Playwright Chromium
        if: ${{ steps.preflight.outputs.enabled == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Create .env.local
        if: ${{ steps.preflight.outputs.enabled == 'true' }}
        run: |
          cat <<'EOF' > .env.local
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL=${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_API_URL=http://127.0.0.1:3000
          PORT=3000
          AUTH_PROVIDER=supabase
          EOF

      - name: Playwright UI E2E
        if: ${{ steps.preflight.outputs.enabled == 'true' }}
        run: npm run -s test:e2e:ui

      - name: Skip E2E UI
        if: ${{ steps.preflight.outputs.enabled != 'true' }}
        run: echo "Skipping Playwright UI E2E because required GitHub secrets are not configured."

      - name: Upload Playwright artifacts
        if: ${{ always() && steps.preflight.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  rag-eval:
    name: RAG Evaluation Gate
    runs-on: ubuntu-latest
    needs: gate
    if: >-
      github.event_name == 'pull_request' &&
      (
        contains(github.event.pull_request.title, 'rag') ||
        contains(github.event.pull_request.title, 'RAG') ||
        contains(github.event.pull_request.title, 'retrieval') ||
        contains(github.event.pull_request.title, 'knowledge')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed files
        id: changes
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          RAG_CHANGED=false
          for file in $CHANGED; do
            case "$file" in
              src/lib/rag/*|lib/rag/*|docs/evals/*|scripts/eval-rag*|scripts/ingest-rag*)
                RAG_CHANGED=true
                break
                ;;
            esac
          done
          echo "rag_changed=$RAG_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.changes.outputs.rag_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.rag_changed == 'true'
        run: npm ci

      - name: Create .env.local
        if: steps.changes.outputs.rag_changed == 'true'
        run: |
          cat <<'EOF' > .env.local
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EOF

      - name: Run RAG evaluation gate
        if: steps.changes.outputs.rag_changed == 'true'
        run: npm run rag:eval:gate

      - name: Upload evaluation report
        if: always() && steps.changes.outputs.rag_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: artifacts/rag_eval_report.json
          if-no-files-found: ignore

      - name: Skip RAG eval
        if: steps.changes.outputs.rag_changed != 'true'
        run: echo "No changes to RAG knowledge base or retrieval logic. Skipping evaluation."
